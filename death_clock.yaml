# Board: ESP32-C3 Super Mini (Generic)
esphome:
  name: death-clock
  friendly_name: death-clock

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "REMOVED"

ota:
  - platform: esphome

wifi:
  ssid: "REMOVED"
  password: "REMOVED"
  ap:
    ssid: death-clock Fallback Hotspot
    password: "REMOVED"

captive_portal:

spi:
  clk_pin: GPIO1
  mosi_pin: GPIO0

text_sensor:
  - platform: homeassistant
    name: "Matrix Display Message"
    entity_id: input_text.matrix_message
    id: display_text

sensor:
  - platform: homeassistant
    name: "Countdown Target Unix Time"
    entity_id: input_number.countdown_target_timestamp
    id: countdown_target

time:
  - platform: homeassistant
    id: homeassistant_time

font:
  - file:
      type: web
      url: "https://raw.githubusercontent.com/olikraus/u8g2/master/tools/font/ttf/lucasfont_alternate.ttf"
    id: matrix_font
    size: 8
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz"

display:
  - platform: max7219digit
    id: matrix
    cs_pin: GPIO4
    num_chips: 8
    intensity: 5
    rotate_chip: 0
    scroll_enable: true
    scroll_mode: CONTINUOUS
    scroll_speed: 250ms
    scroll_dwell: 1000ms
    scroll_delay: 1500ms
    update_interval: 500ms
    lambda: |-
      const int y = -3;
      std::string msg = id(display_text).state;
      if (!msg.empty() && msg != "unknown" && msg != "unavailable") {
        it.print(0, y, id(matrix_font), msg.c_str());
        return;
      }

      auto now = id(homeassistant_time).now();
      float target = id(countdown_target).state;
      if (!now.is_valid() || isnan(target)) {
        it.print(0, y, id(matrix_font), "--:--");
        return;
      }

      int64_t remaining = (int64_t) target - (int64_t) now.timestamp;
      if (remaining <= 0) {
        it.print(0, y, id(matrix_font), "DEAD");
        return;
      }

      int days = remaining / 86400;
      int hours = (remaining % 86400) / 3600;
      int minutes = (remaining % 3600) / 60;
      int seconds = remaining % 60;

      if (days > 0) {
        it.printf(0, y, id(matrix_font), "%dd%02dh", days, hours);
      } else if (hours > 0) {
        it.printf(0, y, id(matrix_font), "%02d:%02d", hours, minutes);
      } else {
        it.printf(0, y, id(matrix_font), "%02d:%02d", minutes, seconds);
      }

number:
  - platform: template
    name: "Matrix Brightness"
    id: matrix_brightness
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    set_action:
      - lambda: id(matrix).intensity((uint8_t) x);

switch:
  - platform: template
    name: "Matrix Power"
    id: matrix_power
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: id(matrix).turn_on_off(true);
    turn_off_action:
      - lambda: id(matrix).turn_on_off(false);
