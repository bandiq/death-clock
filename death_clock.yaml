# Board: ESP32-C3 Super Mini (Generic)
esphome:
  name: death-clock
  friendly_name: death-clock

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret death_clock_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # C3 Super Mini antenna detunes at full TX power, causing 'Auth Expired'
  output_power: 8.5dB
  ap:
    ssid: death-clock Fallback Hotspot
    password: !secret death_clock_ap_password

captive_portal:

spi:
  clk_pin: GPIO3
  mosi_pin: GPIO0

text_sensor:
  - platform: homeassistant
    name: "Matrix Display Message"
    entity_id: input_text.matrix_message
    id: display_text

sensor:
  - platform: homeassistant
    name: "Countdown Target Unix Time"
    entity_id: input_number.countdown_target_timestamp
    id: countdown_target

time:
  - platform: homeassistant
    id: homeassistant_time

font:
  - file:
      type: web
      url: "https://raw.githubusercontent.com/olikraus/u8g2/master/tools/font/ttf/lucasfont_alternate.ttf"
    id: matrix_font
    size: 8
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz"

display:
  - platform: max7219digit
    id: matrix
    cs_pin: GPIO4
    num_chips: 8
    intensity: 5
    rotate_chip: 0
    scroll_enable: true
    scroll_mode: CONTINUOUS
    scroll_speed: 250ms
    scroll_dwell: 1000ms
    scroll_delay: 1500ms
    update_interval: 100ms
    lambda: |-
      const int y = -3;
      const int cx = it.get_width() / 2;
      auto mode = id(display_mode).current_option();

      if (mode == "Text") {
        std::string msg = id(display_text).state;
        if (msg.empty() || msg == "unknown" || msg == "unavailable") {
          msg = "(no text)";
        }
        it.print(0, y, id(matrix_font), msg.c_str());
        return;
      }

      if (mode == "Timer") {
        int state = id(kt_state);
        if (state == 0) {
          it.print(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "timer");
          return;
        }
        uint32_t ms = id(kt_ms);
        if (state == 2) {
          int32_t left = id(kt_end_ms) - millis();
          ms = left > 0 ? left : 0;
        } else if (state == 4) {
          ms = 0;
        }
        bool blink = state == 3 || state == 4;
        if (blink && millis() % 1000 >= 500) {
          return;
        }
        int total = (ms + 999) / 1000;
        if (total >= 3600) {
          it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%d:%02d:%02d",
                    total / 3600, (total / 60) % 60, total % 60);
        } else {
          it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%02d:%02d",
                    total / 60, total % 60);
        }
        return;
      }

      if (mode == "Stopwatch") {
        uint32_t ms = id(sw_elapsed_ms);
        if (id(sw_running)) {
          ms += millis() - id(sw_start_ms);
        }
        int tenths = (ms / 100) % 10;
        int total = ms / 1000;
        if (total >= 3600) {
          it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%d:%02d:%02d.%d",
                    total / 3600, (total / 60) % 60, total % 60, tenths);
        } else {
          it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%02d:%02d.%d",
                    total / 60, total % 60, tenths);
        }
        return;
      }

      auto now = id(homeassistant_time).now();

      if (mode == "Clock") {
        if (!now.is_valid()) {
          it.print(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "--:--:--");
          return;
        }
        if (id(clock_show_date)) {
          it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%d %s",
                    now.day_of_month, now.strftime("%b %Y").c_str());
        } else {
          it.strftime(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%a %H:%M:%S", now);
        }
        return;
      }

      float target = id(countdown_target).state;
      if (!now.is_valid() || isnan(target)) {
        it.print(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "--:--");
        return;
      }

      int64_t remaining = (int64_t) target - (int64_t) now.timestamp;
      if (remaining <= 0) {
        it.print(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "DEAD");
        return;
      }

      int days = remaining / 86400;
      int hours = (remaining % 86400) / 3600;
      int minutes = (remaining % 3600) / 60;
      int seconds = remaining % 60;

      if (days > 0) {
        it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%dd%02dh", days, hours);
      } else if (hours > 0) {
        it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%02d:%02d", hours, minutes);
      } else {
        it.printf(cx, y, id(matrix_font), TextAlign::TOP_CENTER, "%02d:%02d", minutes, seconds);
      }

globals:
  - id: sw_running
    type: bool
    initial_value: "false"
  - id: sw_start_ms
    type: uint32_t
    initial_value: "0"
  - id: sw_elapsed_ms
    type: uint32_t
    initial_value: "0"
  - id: clock_show_date
    type: bool
    initial_value: "false"
  # Kitchen timer: 0 idle, 1 setting, 2 running, 3 paused, 4 expired
  - id: kt_state
    type: int
    initial_value: "0"
  # Set duration while setting, remaining time while paused
  - id: kt_ms
    type: uint32_t
    initial_value: "0"
  - id: kt_end_ms
    type: uint32_t
    initial_value: "0"

script:
  - id: sw_toggle
    then:
      - lambda: |-
          if (id(sw_running)) {
            id(sw_elapsed_ms) += millis() - id(sw_start_ms);
            id(sw_running) = false;
          } else {
            id(sw_start_ms) = millis();
            id(sw_running) = true;
          }
  - id: sw_reset
    then:
      - lambda: |-
          id(sw_running) = false;
          id(sw_elapsed_ms) = 0;
  - id: sw_hold_reset
    mode: restart
    then:
      - delay: 1s
      - script.execute: sw_reset
  - id: piezo_on
    parameters:
      freq: float
    then:
      - lambda: |-
          id(piezo_a).update_frequency(freq);
          id(piezo_b).update_frequency(freq);
          id(piezo_a).set_level(0.5);
          id(piezo_b).set_level(0.5);
  - id: piezo_off
    then:
      - lambda: |-
          id(piezo_a).set_level(0);
          id(piezo_b).set_level(0);
  - id: beep
    mode: restart
    then:
      - if:
          condition:
            not:
              script.is_running: buzzer_alarm
          then:
            - script.execute:
                id: piezo_on
                freq: 3000
            - delay: 30ms
            - script.execute: piezo_off
  - id: buzzer_alarm
    mode: restart
    then:
      - script.stop: beep
      - repeat:
          count: 90
          then:
            - output.turn_on: orange_led_output
            - script.execute:
                id: piezo_on
                freq: 3000
            - delay: 100ms
            - script.execute: piezo_off
            - output.turn_off: orange_led_output
            - delay: 100ms
            - if:
                condition:
                  lambda: "return iteration % 3 == 2;"
                then:
                  - delay: 400ms
      - script.execute: led_restore
  - id: buzzer_alarm_stop
    then:
      - script.stop: buzzer_alarm
      - script.execute: piezo_off
      - script.execute: led_restore
  - id: led_restore
    then:
      - lambda: id(orange_led_output).set_state(id(orange_led).current_values.is_on());
  - id: show_date
    mode: restart
    then:
      - lambda: "id(clock_show_date) = true;"
      - delay: 3s
      - lambda: "id(clock_show_date) = false;"
  - id: kt_add
    then:
      - lambda: |-
          const uint32_t step = 5 * 60 * 1000;
          const uint32_t max_ms = (9 * 60 + 55) * 60 * 1000;
          id(kt_ms) = std::min(id(kt_ms) + step, max_ms);
          id(kt_state) = 1;
  - id: kt_fast_add
    mode: restart
    then:
      - delay: 600ms
      - repeat:
          count: 120
          then:
            - script.execute: kt_add
            - script.execute: beep
            - delay: 150ms
  - id: kt_autostart
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: "return id(kt_state) == 1;"
          then:
            - lambda: |-
                id(kt_end_ms) = millis() + id(kt_ms);
                id(kt_state) = 2;
            - script.execute: beep
  - id: kt_toggle
    then:
      - lambda: |-
          if (id(kt_state) == 2) {
            int32_t left = id(kt_end_ms) - millis();
            id(kt_ms) = left > 0 ? left : 0;
            id(kt_state) = 3;
          } else if (id(kt_state) == 3) {
            id(kt_end_ms) = millis() + id(kt_ms);
            id(kt_state) = 2;
          }
  - id: kt_reset
    then:
      - script.stop: kt_autostart
      - script.stop: kt_fast_add
      - lambda: |-
          id(kt_state) = 0;
          id(kt_ms) = 0;
  - id: kt_hold_reset
    mode: restart
    then:
      - delay: 1s
      - script.execute: kt_reset

select:
  - platform: template
    name: "Display Mode"
    id: display_mode
    options:
      - Clock
      - Timer
      - Stopwatch
      - Countdown
      - Text
    initial_option: Clock
    restore_value: true
    optimistic: true

# Each button bridges a GPIO held low (output) to a GPIO with pull-up (input)
output:
  - platform: gpio
    id: button_mode_drive
    pin: GPIO21
  - platform: gpio
    id: button_action_drive
    pin: GPIO6
  - platform: ledc
    id: piezo_a
    pin: GPIO7
    channel: 0
    frequency: 3000Hz
  # Same LEDC timer as piezo_a (channels 0/1), 180° out of phase for push-pull drive
  - platform: ledc
    id: piezo_b
    pin: GPIO20
    channel: 1
    frequency: 3000Hz
    phase_angle: 180°
  - platform: gpio
    id: orange_led_output
    pin:
      number: GPIO5
      inverted: true

light:
  - platform: binary
    name: "Orange LED"
    id: orange_led
    output: orange_led_output

binary_sensor:
  - platform: gpio
    id: button_mode
    internal: true
    pin:
      number: GPIO10
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - script.execute: beep
      - select.next:
          id: display_mode
          cycle: true
  # GPIO8 is a strapping pin and drives the onboard LED, so it lights while pressed
  - platform: gpio
    id: button_action
    internal: true
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - if:
          condition:
            script.is_running: buzzer_alarm
          then:
            - script.execute: buzzer_alarm_stop
          else:
            - if:
                condition:
                  lambda: 'return id(display_mode).current_option() == "Clock";'
                then:
                  - script.execute: show_date
            - if:
                condition:
                  lambda: 'return id(display_mode).current_option() == "Stopwatch";'
                then:
                  - script.execute: sw_toggle
                  - script.execute: sw_hold_reset
            - if:
                condition:
                  lambda: 'return id(display_mode).current_option() == "Timer";'
                then:
                  - if:
                      condition:
                        lambda: "return id(kt_state) == 0 || id(kt_state) == 1;"
                      then:
                        - script.stop: kt_autostart
                        - script.execute: kt_add
                        - script.execute: kt_fast_add
                      else:
                        - script.execute: kt_toggle
                        - script.execute: kt_hold_reset
            - script.execute: beep
    on_release:
      - script.stop: sw_hold_reset
      - script.stop: kt_hold_reset
      - script.stop: kt_fast_add
      - if:
          condition:
            lambda: "return id(kt_state) == 1;"
          then:
            - script.execute: kt_autostart

button:
  - platform: template
    name: "Stopwatch Start Stop"
    on_press:
      - script.execute: sw_toggle
  - platform: template
    name: "Stopwatch Reset"
    on_press:
      - script.execute: sw_reset
  - platform: template
    name: "Alarm"
    on_press:
      - script.execute: buzzer_alarm
  - platform: template
    name: "Alarm Stop"
    on_press:
      - script.execute: buzzer_alarm_stop

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: "return id(kt_state) == 2 && (int32_t) (id(kt_end_ms) - millis()) <= 0;"
          then:
            - lambda: "id(kt_state) = 4;"
            - select.set:
                id: display_mode
                option: Timer
            - script.execute: buzzer_alarm
      - if:
          condition:
            and:
              - lambda: "return id(kt_state) == 4;"
              - not:
                  script.is_running: buzzer_alarm
          then:
            - script.execute: kt_reset

number:
  - platform: template
    name: "Matrix Brightness"
    id: matrix_brightness
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    set_action:
      - lambda: id(matrix).intensity((uint8_t) x);

switch:
  - platform: template
    name: "Matrix Power"
    id: matrix_power
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: id(matrix).turn_on_off(true);
    turn_off_action:
      - lambda: id(matrix).turn_on_off(false);
